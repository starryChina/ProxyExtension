<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>代理切换器 Beta 0.1.2</title>
  <style>
    body {
      width: 260px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
    }
    h3 {
      margin-top: 0;
      text-align: center;
      color: #4CAF50;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: bold;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      gap: 5px;
    }
    button {
      flex: 1;
      padding: 8px 5px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    #saveBtn {
      background-color: #2196F3;
      color: white;
    }
    #saveBtn:hover {
      background-color: #0b7dda;
    }
    #toggleBtn {
      background-color: #f44336;
      color: white;
    }
    #toggleBtn.on {
      background-color: #4CAF50;
    }
    .status-container {
      margin-top: 15px;
      text-align: center;
      padding: 10px;
      border-radius: 4px;
      background-color: #f5f5f5;
      font-size: 14px;
    }
    #status {
      font-weight: bold;
      font-size: 15px;
    }
    .text-on { color: #4CAF50; }
    .text-off { color: #f44336; }
    
    .test-result-container {
      margin-top: 10px;
      text-align: center;
      padding: 8px;
      border-radius: 4px;
      background-color: #e3f2fd;
      font-size: 13px;
      display: none;
    }
    .test-success { color: #4CAF50; font-weight: bold; }
    .test-fail { color: #f44336; font-weight: bold; }
    .test-loading { color: #ff9800; font-weight: bold; }
    
    .message-container {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: #f44336;
      min-height: 18px;
      font-weight: bold;
    }
    .webrtc-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 4px;
      background-color: #f5f5f5;
    }
    .webrtc-label {
      font-size: 14px;
      font-weight: bold;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.2s;
      border-radius: 24px;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }
    .switch input:checked + .slider {
      background-color: #4CAF50;
    }
    .switch input:checked + .slider:before {
      transform: translateX(20px);
    }
  </style>
</head>
<body>
  <h3>代理切换器 Beta 0.1.0</h3>
  
  <div class="form-group">
    <label for="scheme">代理协议:</label>
    <select id="scheme">
      <option value="http">HTTP</option>
      <option value="https">HTTPS</option>
      <option value="socks5">SOCKS5</option>
      <option value="socks4">SOCKS4</option>
    </select>
  </div>

  <div class="form-group">
    <label for="host">代理 IP / 域名:</label>
    <input type="text" id="host" placeholder="例如: 127.0.0.1">
  </div>
  
  <div class="form-group">
    <label for="port">端口 (Port):</label>
    <input type="number" id="port" placeholder="例如: 8080">
  </div>

  <div id="messageBox" class="message-container"></div>
  
  <div class="controls">
    <button id="saveBtn">保存</button>
    <button id="toggleBtn">开启代理</button>
  </div>
  
  <div id="testResult" class="test-result-container">
    连通性: <span id="testStatus">-</span>
  </div>

  <div class="status-container">
    当前状态: <span id="status" class="text-off">已关闭</span>
  </div>

  <div class="webrtc-container">
    <div class="webrtc-label">WebRTC 防护</div>
    <label class="switch">
      <input type="checkbox" id="webrtcToggle">
      <span class="slider"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
